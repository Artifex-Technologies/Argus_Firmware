name: 'Post-release hooks'

# Manual only (2026-11-07): this is Flipper's CI, written for Flipper's own build machines (self-hosted runners) and
# images we do not have, so on our account every automatic run failed. Start it from Actions > Run workflow.
on:
  workflow_dispatch:

jobs:
  reindex:
    name: 'Post-release hooks'
    runs-on: [self-hosted, FlipperZeroShell]
    steps:
      - name: 'Checkout code'
        uses: actions/checkout@v4

      - name: 'Trigger reindex'
        run: |
          curl --fail -L -H "Token: ${{ secrets.INDEXER_TOKEN }}" \
              "${{ secrets.INDEXER_URL }}"/firmware/reindex;

      - name: 'Send release notification'
        if: ${{ github.event.action == 'released' }}
        run: |
          echo '${{ secrets.FIREBASE_TOKEN }}' > firebase-token.json;
          python3 -m pip install firebase-admin==6.4.0;
          python3 scripts/send_firebase_notification.py \
              "--version=${{ github.event.release.name }}" \
              "--token=firebase-token.json";

      - name: 'Remove firebase token'
        if: always()
        run: |
          rm -rf firebase-token.json;
